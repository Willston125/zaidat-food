<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion du site — ZAIDAT FOOD</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/assets/img/favicon-64.png">
  <link rel="stylesheet" href="/assets/fonts/polices.css">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

<header class="adm-header">
  <div class="adm-header__brand">
    <img src="/assets/img/logo-96.png" alt="" width="38" height="38">
    <div>
      <strong>Gestion du site</strong>
      <small>ZAIDAT FOOD</small>
    </div>
  </div>
  <div class="adm-header__right">
    <span class="adm-etat" id="etat-modifs">Chargement…</span>
    <a class="btn-mini" href="../index.html" target="_blank" rel="noopener">Voir le site</a>
    <button class="btn btn--primary" id="btn-publier" disabled>Enregistrer</button>
  </div>
</header>

<div class="adm-corps">
  <nav class="adm-nav" aria-label="Sections de gestion">
    <button class="adm-nav__item is-active" data-vue="produits">Produits<span class="adm-nav__compteur" id="nb-produits">0</span></button>
    <button class="adm-nav__item" data-vue="categories">Catégories</button>
    <button class="adm-nav__item" data-vue="textes">Textes du site</button>
    <button class="adm-nav__item" data-vue="contact">Contact &amp; livraison</button>
    <button class="adm-nav__item" data-vue="galerie">Galerie</button>
    <button class="adm-nav__item" data-vue="temoignages">Témoignages</button>
    <button class="adm-nav__item" data-vue="connexion">Connexion<span class="adm-pastille" id="pastille-connexion" hidden></span></button>
  </nav>

  <main class="adm-vue" id="adm-vue">
    <div class="adm-chargement">Chargement des données du site…</div>
  </main>
</div>

<!-- Panneau d'édition produit (tiroir latéral) -->
<div class="adm-overlay" id="adm-overlay" hidden></div>
<aside class="adm-tiroir" id="adm-tiroir" hidden role="dialog" aria-modal="true" aria-labelledby="tiroir-titre">
  <header class="adm-tiroir__tete">
    <h2 id="tiroir-titre">Modifier le produit</h2>
    <button class="btn-mini" id="tiroir-fermer" aria-label="Fermer">Fermer</button>
  </header>
  <div class="adm-tiroir__corps" id="tiroir-corps"></div>
  <footer class="adm-tiroir__pied">
    <!-- Ce qui manque reste ecrit ici tant que ce n'est pas corrige : un
         message qui s'efface au bout de trois secondes laissait croire
         que le bouton « Valider » ne repondait pas. -->
    <p class="tiroir-erreur" id="err-produit" role="alert" hidden></p>
    <button class="btn btn--ghost" id="tiroir-annuler">Annuler</button>
    <button class="btn btn--primary" id="tiroir-valider">Valider ce produit</button>
  </footer>
</aside>

<!-- Fenêtre de publication -->
<div class="adm-modale" id="modale-publier" hidden role="dialog" aria-modal="true" aria-labelledby="pub-titre">
  <div class="adm-modale__boite">
    <h2 id="pub-titre">Publier les modifications</h2>
    <div id="pub-corps"></div>
    <div class="adm-modale__actions">
      <button class="btn btn--ghost" id="pub-annuler">Annuler</button>
      <button class="btn btn--primary" id="pub-confirmer">Publier maintenant</button>
    </div>
  </div>
</div>

<div class="adm-toast" id="adm-toast" role="status" aria-live="polite"></div>

<!-- Catalogue de secours du site : ces deux fichiers exposent
     CATEGORIES, PRODUCTS et SITE_CONFIG. Le dashboard s'en sert
     quand la base est vide ou injoignable. Les charger comme des
     scripts ordinaires évite d'avoir à les exécuter à la volée,
     et donc d'autoriser « unsafe-eval » dans la CSP du site. -->
<script src="/js/config.js"></script>
<script src="/js/products.js"></script>
<script src="/js/supabase-config.js"></script>
<script src="/js/supabase.js"></script>
<script src="/admin/js/backend.js"></script>
<script src="/admin/js/cropper.js"></script>
<script src="/admin/js/serialize.js"></script>
<script src="/admin/js/admin.js"></script>
</body>
</html>
